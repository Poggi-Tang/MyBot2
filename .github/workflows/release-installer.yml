name: Build Windows installer

on:
  push:
    tags:
      - "v2.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c "from mybot_ui import __version__; print(__version__)"
          $tag = "${{ github.ref_name }}"
          $validTag = ($tag -eq "v$version") -or $tag.StartsWith("v$version-beta.")
          if (-not $validTag -and "${{ github.event_name }}" -ne "workflow_dispatch") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }
          "MYBOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version $env:MYBOT_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBot2-Setup-${{ env.MYBOT_VERSION }}-x64
          path: |
            dist/MyBot2-Setup-${{ env.MYBOT_VERSION }}-x64.exe
            dist/MyBot2-Setup-${{ env.MYBOT_VERSION }}-x64.exe.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          body_path: docs/releases/v${{ env.MYBOT_VERSION }}.md
          files: |
            dist/MyBot2-Setup-${{ env.MYBOT_VERSION }}-x64.exe
            dist/MyBot2-Setup-${{ env.MYBOT_VERSION }}-x64.exe.sha256
